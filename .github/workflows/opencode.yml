name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Отчёт агента содержит ссылку https://opencode.ai/s/… — подстрока
    # «/opencode» в ней проходит гейт, и бот перезапускает воркфлоу своим
    # же комментарием. Дальше permission-гейт CLI проверяет actor'а
    # (автора комментария), у бота collaborator-permission = none, и
    # прогон падает с мусорным комментарием об ошибке. Команды /oc —
    # только от людей.
    if: |-
      (contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Прогоны агента периодически зависают молча (2ч10м до ручной отмены,
    # 2026-10-08; task-9, PR #15) — дефолт GitHub 360 минут. Реализация
    # фичи занимает 17m47s (task-10) и >20 мин (37776808500, убит
    # потолком без единого «asking») — потолок 30, как в opencode-review.
    timeout-minutes: 30
    # Повторный запуск той же команды отменяет её предыдущий прогон,
    # а не висит в очереди. Ключ — id комментария: разные команды
    # в разных тредах выполняются независимо, как и раньше.
    concurrency:
      group: opencode-${{ github.event.comment.id }}
      cancel-in-progress: true
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        with:
          model: zai-coding-plan/glm-5.3-flash
          # share: true
