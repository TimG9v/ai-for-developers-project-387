name: Frontend CI

on:
  # прогон на каждый push во все ветки — критерий приёмки шага 1/4.
  # paths-фильтр только на pull_request: экономия минут на PR из форков;
  # на ветках этого же репо CI и так запускается push-триггером.
  push:
  pull_request:
    paths:
      - "frontend/**"
      - ".nvmrc"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # версия зеркалит .nvmrc; файл резолвится
          # относительно GITHUB_WORKSPACE (корень репо)
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
