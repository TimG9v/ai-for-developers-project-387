name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Новый push в PR отменяет предыдущее ревью: виснущие прогоны
# не копятся в очереди (зависание task-9, PR #15).
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # `opencode github run` требует collaborator-permission у автора PR
    # (actor события pull_request); у ботов — opencode-agent,
    # release-please — она равна none, прогон падает до старта агента.
    # Ревью бот-PR — /oc-комментарием человека на PR (actor = человек,
    # гейт проходит).
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Прогоны opencode периодически зависают молча; дефолт GitHub —
    # 360 минут. Режем через 30: маленькие PR ревьювятся за 2–3 минуты,
    # большие (PR #15) — около 10–15; 360 оставлять нельзя.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Ревью-агент после комментария полез делать git-коммит в песочнице
      # раннера и падал «Author identity unknown» (PR #15, 2026-10-07):
      # задаём identity, чтобы агент мог довести свои локальные проверки
      # до конца.
      #
      # `opencode github run` после агента при «грязном» ворктрее сам
      # коммитит и пушит в ветку PR; без credentials на push прогон
      # падает и теряет текст ревью (PR #20, 2026-10-08). Ревью здесь
      # read-only: уводим push в локальный bare-репозиторий — git push
      # завершается успехом, ничего не меняя в PR.
      - name: Git identity и no-op push для ревью-агента
        run: |
          git config user.name "opencode-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Клон на раннере неглубокий (fetch-depth: 1) — bare по умолчанию
          # отклоняет пуш из shallow-клона («shallow update not allowed»).
          git init --bare /tmp/push-noop.git
          git -C /tmp/push-noop.git config receive.shallowUpdate true
          git remote set-url --push origin /tmp/push-noop.git

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: zai-coding-plan/glm-5.3-flash
          share: false
          use_github_token: true
          prompt: |
            Проведи первое ревью этого pull request как участник команды
            календарного приложения. Критерии:
            1. Коммиты PR — по Conventional Commits (feat/fix/ci/docs/...).
            2. Контракт прежде всего: сгенерированные файлы
               (frontend/src/client/, серверные типы backend) не правятся
               руками — только перегенерация из contracts/main.tsp.
            3. Потенциальные баги: необработанные 404/409, гонки при
               бронировании слота, валидация входных данных.
            4. Соответствие правилам AGENTS.md (стиль, типы, тесты).
            Оставь замечания комментарием к pull request: каждое —
            отдельным пунктом, с файлом и строкой. Если замечаний нет —
            короткое резюме «существенных замечаний нет».
            Не мержи и не одобряй PR. Коммитов и пушей не делай:
            репозиторий для тебя только для чтения, результат ревью —
            исключительно комментарий к PR.
